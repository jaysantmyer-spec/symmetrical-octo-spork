name: probe (diagnostics)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python scripts/probe.py
      - run: |
          git config user.name "tt-oracle-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/raw/probe.txt && git commit -m "probe" && git pull --rebase origin main && git push || true
