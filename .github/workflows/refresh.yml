name: refresh (results, odds, learn, predict)
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Update data, grade, learn, retrain, predict
        run: python -m tt_oracle cycle
      - name: Weekly backtest (Monday's first run)
        run: |
          if [ "$(date +%u)" = "1" ] && [ "$(date +%H)" -lt 6 ]; then python -m tt_oracle backtest --days 60 || true; fi
      - name: Commit data
        run: |
          git config user.name "tt-oracle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data models
          git commit -m "refresh $(date -u +'%Y-%m-%d %H:%M')" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
